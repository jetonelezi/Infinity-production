<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Celebration</title>
    <style>
        :root {
            --primary: #ff477e;
            --secondary: #764ba2;
            --glass: rgba(255, 255, 255, 0.12);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #0a0a0a;
            color: white;
            text-align: center;
        }

        .hero {
            padding: 60px 20px;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1464349153735-7db50ed83c84?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        h1 { font-size: clamp(2rem, 6vw, 4rem); margin-bottom: 40px; }
        .label-title { color: var(--primary); text-transform: uppercase; letter-spacing: 3px; font-weight: bold; margin: 40px 0 10px; }

        /* Counter Grids */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto 30px;
        }

        .box {
            background: var(--glass);
            backdrop-filter: blur(8px);
            padding: 15px 5px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .box span { display: block; font-size: 1.5rem; font-weight: bold; }
        .box label { font-size: 0.65rem; text-transform: uppercase; opacity: 0.7; }

        /* Specific Birthday Countdown Style */
        .birthday-countdown .box {
            border: 1px solid var(--primary);
            background: rgba(255, 71, 126, 0.1);
        }

        .gallery-container { padding: 60px 20px; max-width: 1200px; margin: 0 auto; }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .media-card img { width: 100%; height: 350px; object-fit: cover; border-radius: 15px; }

        .btn {
            padding: 15px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>ANIDA ALIU</h1>

        <p class="label-title">Ju keni jetuar:</p>
        <div class="grid">
            <div class="box"><span id="live-years">0</span><label>Years</label></div>
            <div class="box"><span id="live-months">0</span><label>Months</label></div>
            <div class="box"><span id="live-weeks">0</span><label>Weeks</label></div>
            <div class="box"><span id="live-days">0</span><label>Days</label></div>
            <div class="box"><span id="live-hours">0</span><label>Hours</label></div>
            <div class="box"><span id="live-mins">0</span><label>Minutes</label></div>
            <div class="box"><span id="live-secs">0</span><label>Seconds</label></div>
        </div>

        <hr style="opacity: 0.2; max-width: 800px; margin: 40px auto;">

        <p class="label-title">Ditelindja ka mbetur edhe:</p>
        <div class="grid birthday-countdown" style="max-width: 600px;">
            <div class="box"><span id="cd-days">00</span><label>Days</label></div>
            <div class="box"><span id="cd-hours">00</span><label>Hours</label></div>
            <div class="box"><span id="cd-mins">00</span><label>Minutes</label></div>
            <div class="box"><span id="cd-secs">00</span><label>Seconds</label></div>
        </div>

        <button class="btn" onclick="celebrate()">Celebrate Now! 🎊</button>
    </section>

    <div class="gallery-container">
        <h2>20 May 2005 - Memories</h2>
        <div class="media-grid">
            <div class="media-card"><img src="WhatsApp Image 2026-04-25 at 23.00.06.jpeg"></div>
            <div class="media-card"><img src="WhatsApp Image 2026-04-25 at 23.00.05.jpeg"></div>
            <div class="media-card"><img src="WhatsApp Image 2026-04-25 at 22.55.27.jpeg"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const birthDate = new Date("May 19, 2005 00:00:00");
        // Next birthday: May 19, 2026
        const nextBirthday = new Date("May 19, 2026 00:00:00");

        function updateAll() {
            const now = new Date();

            // 1. LIFE COUNTER LOGIC
            const diffAlive = now - birthDate;
            const totalSecs = Math.floor(diffAlive / 1000);
            const totalMins = Math.floor(totalSecs / 60);
            const totalHrs = Math.floor(totalMins / 60);
            const totalDays = Math.floor(totalHrs / 24);
            const totalWeeks = Math.floor(totalDays / 7);

            let yearsAlive = now.getFullYear() - birthDate.getFullYear();
            let monthsAlive = (now.getMonth() - birthDate.getMonth()) + (yearsAlive * 12);
            if (now.getDate() < birthDate.getDate()) monthsAlive--;
            
            document.getElementById("live-years").innerText = Math.floor(monthsAlive/12).toLocaleString();
            document.getElementById("live-months").innerText = monthsAlive.toLocaleString();
            document.getElementById("live-weeks").innerText = totalWeeks.toLocaleString();
            document.getElementById("live-days").innerText = totalDays.toLocaleString();
            document.getElementById("live-hours").innerText = totalHrs.toLocaleString();
            document.getElementById("live-mins").innerText = totalMins.toLocaleString();
            document.getElementById("live-secs").innerText = totalSecs.toLocaleString();

            // 2. BIRTHDAY COUNTDOWN LOGIC
            const diffCD = nextBirthday - now;
            if (diffCD > 0) {
                const cdD = Math.floor(diffCD / (1000 * 60 * 60 * 24));
                const cdH = Math.floor((diffCD % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const cdM = Math.floor((diffCD % (1000 * 60 * 60)) / (1000 * 60));
                const cdS = Math.floor((diffCD % (1000 * 60)) / 1000);

                document.getElementById("cd-days").innerText = cdD.toString().padStart(2, '0');
                document.getElementById("cd-hours").innerText = cdH.toString().padStart(2, '0');
                document.getElementById("cd-mins").innerText = cdM.toString().padStart(2, '0');
                document.getElementById("cd-secs").innerText = cdS.toString().padStart(2, '0');
            } else {
                document.querySelector(".birthday-countdown").innerHTML = "<h3>Happy Birthday! 🎂</h3>";
            }
        }

        setInterval(updateAll, 1000);
        updateAll();

        function celebrate() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }
        window.onload = celebrate;
    </script>
</body>
</html>
