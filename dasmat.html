<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Production - Terminet</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; color: #333; }
        header { background-color: #1a1a1a; color: #d4af37; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 50; }
        .logo-text { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
        nav ul { list-style: none; display: flex; gap: 20px; align-items: center;}
        nav ul li a { color: #fff; text-decoration: none; font-size: 0.95rem; cursor: pointer; transition: color 0.3s; padding: 5px 10px; }
        nav ul li a:hover, nav ul li a.active { color: #d4af37; border-bottom: 2px solid #d4af37; }
        .btn-logout { background: #ff4757; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-weight: 600;}
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 20px;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; }
        button.btn-primary { background-color: #d4af37; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .termin-item { background: #fafafa; border-left: 5px solid #d4af37; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .price { color: #555; font-weight: 600; cursor: pointer; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; }
        .countdown { color: #d84315; font-weight: 600; background: #ffebee; padding: 5px 10px; border-radius: 20px; display: inline-block; margin-top: 10px;}
        .admin-actions { display: flex; flex-direction: column; gap: 8px; min-width: 100px;}
        .btn-edit { background: #3498db; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer;}
        .btn-delete { background: #ff4757; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer;}
        #login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a1a1a; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 350px; text-align: center; border-top: 6px solid #d4af37; }
        #app-screen, #view-section, #add-section { display: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: none; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-bottom:20px;">Infinity Production</h2>
            <input type="password" id="login-password" placeholder="Pass" style="width:100%; padding:15px; margin-bottom:20px; text-align:center; font-size:1.2rem;">
            <button class="btn-primary" onclick="kontrolloHyrjen()">Hyr</button>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <div class="logo-text">Infinity</div>
            <nav>
                <ul>
                    <li><a id="nav-view" onclick="ndryshoFaqen('view')" class="active">Lista</a></li>
                    <li><a id="nav-add" onclick="ndryshoFaqen('add')">Shto</a></li>
                    <li><button class="btn-logout" onclick="dil()">Dil</button></li>
                </ul>
            </nav>
        </header>

        <div class="container">
            <div id="add-section" class="card">
                <h2>Shto Termin</h2>
                <form id="termin-form">
                    <div class="form-group"><label>Çifti</label><input type="text" id="cifti" required></div>
                    <div class="form-group"><label>Lloji</label>
                        <select id="lloji" required>
                            <option value="Dasëm">Dasëm</option>
                            <option value="Fejesë">Fejesë</option>
                            <option value="Kanagjegj">Kanagjegj</option>
                            <option value="Banket">Banket</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Data</label><input type="datetime-local" id="data-ora" required></div>
                    <div class="form-group"><label>Lokacioni</label><input type="text" id="lokacioni" required></div>
                    <div class="form-group"><label>Pajisjet</label><input type="text" id="pajisjet" required></div>
                    <div class="form-group"><label>Çmimi (€)</label><input type="number" id="cmimi" required></div>
                    <div class="form-group"><label>Stafi</label><input type="text" id="puntoret" required></div>
                    <div class="form-group"><label>Shënime</label><textarea id="pershkrimi"></textarea></div>
                    <button type="submit" class="btn-primary">Ruaj Online</button>
                </form>
            </div>

            <div id="view-section">
                <div id="termin-list"></div>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Modifiko</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group"><label>Çifti</label><input type="text" id="edit-cifti"></div>
                <div class="form-group"><label>Lloji</label>
                    <select id="edit-lloji">
                        <option value="Dasëm">Dasëm</option>
                        <option value="Fejesë">Fejesë</option>
                        <option value="Kanagjegj">Kanagjegj</option>
                        <option value="Banket">Banket</option>
                    </select>
                </div>
                <div class="form-group"><label>Data</label><input type="datetime-local" id="edit-data-ora"></div>
                <div class="form-group"><label>Lokacioni</label><input type="text" id="edit-lokacioni"></div>
                <div class="form-group"><label>Pajisjet</label><input type="text" id="edit-pajisjet"></div>
                <div class="form-group"><label>Çmimi</label><input type="number" id="edit-cmimi"></div>
                <div class="form-group"><label>Stafi</label><input type="text" id="edit-puntoret"></div>
                <div class="form-group"><label>Shënime</label><textarea id="edit-pershkrimi"></textarea></div>
                <div style="display:flex; gap:10px;">
                    <button type="submit" class="btn-primary">Ruaj</button>
                    <button type="button" onclick="mbyllModalin()" style="flex:1; background:#888; color:white; border:none; border-radius:6px;">Anulo</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // KONFIGURIMI YT
        const firebaseConfig = {
          apiKey: "AIzaSyCUnAwolrTEWDc-RkSF2uGPLXH2aaZKGAw",
          authDomain: "dasmat-7120d.firebaseapp.com",
          projectId: "dasmat-7120d",
          storageBucket: "dasmat-7120d.firebasestorage.app",
          messagingSenderId: "903337518995",
          appId: "1:903337518995:web:c747d698e4056ab8cdea66"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let terminetArray = [];
        let currentRole = null;

        function kontrolloHyrjen() {
            const pass = document.getElementById('login-password').value;
            if (pass === '123') { currentRole = 'viewer'; hapAplikacionin('view'); }
            else if (pass === 'jeton555!') { currentRole = 'admin'; hapAplikacionin('view'); }
            else { alert("Gabim!"); }
        }

        function hapAplikacionin(faqja) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            ndryshoFaqen(faqja);
            lexoNgaFirebase();
        }

        function dil() { location.reload(); }

        function ndryshoFaqen(faqja) {
            if(faqja === 'add' && currentRole !== 'admin') { alert("Vetem Admin!"); return; }
            document.getElementById('view-section').style.display = (faqja === 'view' ? 'block' : 'none');
            document.getElementById('add-section').style.display = (faqja === 'add' ? 'block' : 'none');
            document.getElementById('nav-view').className = (faqja === 'view' ? 'active' : '');
            document.getElementById('nav-add').className = (faqja === 'add' ? 'active' : '');
        }

        function lexoNgaFirebase() {
            db.collection("terminet").onSnapshot((snap) => {
                terminetArray = [];
                snap.forEach(doc => terminetArray.push({id: doc.id, ...doc.data()}));
                shfaqTerminet();
            });
        }

        function shfaqTerminet() {
            const list = document.getElementById('termin-list');
            list.innerHTML = '';
            terminetArray.sort((a,b) => new Date(a.dataOra) - new Date(b.dataOra));

            terminetArray.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = 'termin-item';
                div.innerHTML = `
                    <div class="termin-info">
                        <h3>${t.cifti}</h3>
                        <p>🎉 ${t.lloji} | 📅 ${t.dataOra.replace('T', ' ')}</p>
                        <p>📍 ${t.lokacioni} | 🎥 ${t.pajisjet}</p>
                        <p>👥 ${t.puntoret}</p>
                        <p class="price" onclick="zbuloCmimin(this, '${t.cmimi}')">💶: <span class="cmimi-vlere">***</span></p>
                        <p class="countdown">${merrKojenEMbetur(t.dataOra)}</p>
                    </div>
                    ${currentRole === 'admin' ? `
                    <div class="admin-actions">
                        <button class="btn-edit" onclick="hapModifikimin('${t.id}')">✏️</button>
                        <button class="btn-delete" onclick="fshijTermin('${t.id}')">🗑️</button>
                    </div>` : ''}
                `;
                list.appendChild(div);
            });
        }

        function merrKojenEMbetur(date) {
            const diff = new Date(date) - new Date();
            if(diff < 0) return "✅ Përfunduar";
            const dite = Math.floor(diff / (1000*60*60*24));
            const ore = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            return `⏳ Edhe ${dite} dite, ${ore} ore`;
        }

        window.zbuloCmimin = function(el, pr) {
            if(prompt("Fjalekalimi:") === "jeton123") el.innerHTML = pr + " €";
        };

        document.getElementById('termin-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const data = {
                cifti: document.getElementById('cifti').value,
                lloji: document.getElementById('lloji').value,
                dataOra: document.getElementById('data-ora').value,
                lokacioni: document.getElementById('lokacioni').value,
                pajisjet: document.getElementById('pajisjet').value,
                cmimi: document.getElementById('cmimi').value,
                puntoret: document.getElementById('puntoret').value,
                pershkrimi: document.getElementById('pershkrimi').value
            };
            db.collection("terminet").add(data).then(() => ndryshoFaqen('view'));
        });

        window.fshijTermin = (id) => { if(confirm("Fshij?")) db.collection("terminet").doc(id).delete(); };

        window.hapModifikimin = (id) => {
            const t = terminetArray.find(x => x.id === id);
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-cifti').value = t.cifti;
            document.getElementById('edit-lloji').value = t.lloji;
            document.getElementById('edit-data-ora').value = t.dataOra;
            document.getElementById('edit-lokacioni').value = t.lokacioni;
            document.getElementById('edit-pajisjet').value = t.pajisjet;
            document.getElementById('edit-cmimi').value = t.cmimi;
            document.getElementById('edit-puntoret').value = t.puntoret;
            document.getElementById('edit-pershkrimi').value = t.pershkrimi;
            document.getElementById('edit-modal').style.display = 'flex';
        };

        function mbyllModalin() { document.getElementById('edit-modal').style.display = 'none'; }

        document.getElementById('edit-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const data = {
                cifti: document.getElementById('edit-cifti').value,
                lloji: document.getElementById('edit-lloji').value,
                dataOra: document.getElementById('edit-data-ora').value,
                lokacioni: document.getElementById('edit-lokacioni').value,
                pajisjet: document.getElementById('edit-pajisjet').value,
                cmimi: document.getElementById('edit-cmimi').value,
                puntoret: document.getElementById('edit-puntoret').value,
                pershkrimi: document.getElementById('edit-pershkrimi').value
            };
            db.collection("terminet").doc(id).update(data).then(() => mbyllModalin());
        });
    </script>
</body>
</html>
