<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menaxhimi i Termineve - Infinity Production</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; color: #333; }
        
        header { background-color: #1a1a1a; color: #d4af37; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header h1 { font-size: 1.8rem; letter-spacing: 2px; text-transform: uppercase; }
        
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card h2 { margin-bottom: 20px; font-size: 1.4rem; color: #1a1a1a; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-family: inherit; 
        }
        .form-group input:focus, .form-group textarea:focus { 
            outline: none; 
            border-color: #d4af37; 
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3); 
        }
        
        button { background-color: #d4af37; color: #fff; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #b8962e; }
        
        .termin-list { display: flex; flex-direction: column; gap: 15px; }
        .termin-item { background: #fafafa; border-left: 5px solid #d4af37; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .termin-info { flex: 1; }
        .termin-info h3 { margin-bottom: 8px; font-size: 1.2rem; color: #1a1a1a; }
        .termin-info p { font-size: 0.9rem; color: #555; margin-bottom: 4px; }
        
        /* Stili për çmimin e fshehur */
        .termin-info .price { 
            color: #555; 
            font-weight: 600; 
            cursor: pointer; 
            display: inline-block;
            padding: 2px 5px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .termin-info .price:hover { background: #e0e0e0; }
        .cmimi-vlere { color: #d4af37; letter-spacing: 2px; }
        
        .termin-info .notes { background: #eee; padding: 8px; border-radius: 4px; margin-top: 8px; font-size: 0.85rem; font-style: italic; }
        .termin-info .countdown { color: #d84315; font-weight: 600; margin-top: 10px; font-size: 0.95rem; }
        
        .btn-delete { background-color: #ff4757; color: white; border: none; width: auto; padding: 8px 15px; font-size: 0.85rem; border-radius: 4px; margin-left: 15px; cursor: pointer; transition: 0.3s; }
        .btn-delete:hover { background-color: #ff6b81; }

        footer { text-align: center; padding: 20px; margin-top: 40px; background: #1a1a1a; color: #888; font-size: 0.9rem; }
        footer a { color: #d4af37; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <h1>Infinity Production</h1>
        <p style="font-size: 0.9rem; color: #fff;">Sistemi i Menaxhimit të Termineve</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Shto Termin të Ri</h2>
            <form id="termin-form">
                <div class="form-group">
                    <label>Çifti (ose Emri i Klientit)</label>
                    <input type="text" id="cifti" placeholder="psh. Ejup & Semavije" required>
                </div>
                <div class="form-group">
                    <label>Data dhe Ora e fillimit</label>
                    <input type="datetime-local" id="data-ora" required>
                </div>
                <div class="form-group">
                    <label>Lokacioni</label>
                    <input type="text" id="lokacioni" placeholder="psh. Restorant NOBEL, Tetovë" required>
                </div>
                <div class="form-group">
                    <label>Paketa / Shërbimet</label>
                    <input type="text" id="pajisjet" placeholder="psh. Vinç, Dron, Foto Session" required>
                </div>
                <div class="form-group">
                    <label>Çmimi Total (€)</label>
                    <input type="number" id="cmimi" placeholder="psh. 1500" required>
                </div>
                <div class="form-group">
                    <label>Punëtorët Angazhuar</label>
                    <input type="text" id="puntoret" placeholder="psh. Jeton, Agron, Kameramani 3" required>
                </div>
                <div class="form-group">
                    <label>Përshkrimi / Shënime Shtesë</label>
                    <textarea id="pershkrimi" rows="3" placeholder="psh. Duhet të jemi aty 1 orë më herët. Klienti kërkon xhirim specifik..."></textarea>
                </div>
                
                <button type="submit">Ruaj Terminin</button>
            </form>
        </div>

        <div class="card">
            <h2>Terminet e Ardhshme</h2>
            <div id="termin-list" class="termin-list">
                </div>
        </div>
    </div>

    <footer>
        <p>Krijuar nga Jeton Elezi | <a href="https://infinity-production.com">www.infinity-production.com</a></p>
    </footer>

    <script>
        // Inicializimi i të dhënave nga Local Storage
        let terminet = JSON.parse(localStorage.getItem('terminetDasma')) || [];

        const form = document.getElementById('termin-form');
        const listContainer = document.getElementById('termin-list');

        // Funksioni për të llogaritur kohën e mbetur
        function merrKojenEMbetur(dataTerminit) {
            const tani = new Date().getTime();
            const dataTarget = new Date(dataTerminit).getTime();
            const distanca = dataTarget - tani;

            if (distanca < 0) return "Ka përfunduar / Është sot!";

            const dite = Math.floor(distanca / (1000 * 60 * 60 * 24));
            const ore = Math.floor((distanca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            return `Kanë mbetur edhe: ${dite} ditë dhe ${ore} orë`;
        }

        // Funksioni për të zbuluar çmimin me fjalëkalim
        window.zbuloCmimin = function(element, cmimiVertet) {
            const span = element.querySelector('.cmimi-vlere');
            
            if (span.innerText !== "***") return; // Nëse është hapur, mos kërko prapë

            const fjalekalimi = prompt("Ju lutem shënoni fjalëkalimin për të parë çmimin:");
            const fjalekalimiSakte = "jeton123";

            if (fjalekalimi === fjalekalimiSakte) {
                span.innerText = cmimiVertet + " €";
                span.style.color = "#27ae60"; 
            } else if (fjalekalimi !== null) {
                alert("Fjalëkalimi është i pasaktë!");
            }
        };

        // Funksioni kryesor për shfaqjen dhe renditjen e termineve
        function shfaqTerminet() {
            listContainer.innerHTML = '';
            
            // Renditja: nga data dhe ora më e afërt tek ajo më e largët
            terminet.sort((a, b) => new Date(a.dataOra) - new Date(b.dataOra));

            if (terminet.length === 0) {
                listContainer.innerHTML = '<p style="color: #888; text-align: center;">Nuk ka termine të regjistruara.</p>';
                return;
            }

            terminet.forEach((termin, index) => {
                const dataEFormatizuar = new Date(termin.dataOra).toLocaleString('sq-AL', { 
                    dateStyle: 'medium', timeStyle: 'short' 
                });

                const countdown = merrKojenEMbetur(termin.dataOra);
                const shenimeHtml = termin.pershkrimi ? `<div class="notes">📝 <strong>Shënime:</strong> ${termin.pershkrimi}</div>` : '';
                
                // Etiketa për terminin e radhës
                const isNext = index === 0 ? '<span style="background: #d4af37; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; margin-left: 10px; vertical-align: middle;">🔥 Termini i Radhës</span>' : '';

                const div = document.createElement('div');
                div.className = 'termin-item';
                
                // Theksimi i terminit të parë me vizë të trashë
                if(index === 0) div.style.borderLeft = "8px solid #d4af37";

                div.innerHTML = `
                    <div class="termin-info">
                        <h3>${termin.cifti} ${isNext}</h3>
                        <p>📅 <strong>${dataEFormatizuar}</strong></p>
                        <p>📍 ${termin.lokacioni}</p>
                        <p>🎥 ${termin.pajisjet}</p>
                        <p>👥 <strong>Stafi:</strong> ${termin.puntoret}</p>
                        <p class="price" onclick="zbuloCmimin(this, '${termin.cmimi}')" title="Kliko për të hapur çmimin">💶 Çmimi: <span class="cmimi-vlere">***</span></p>
                        ${shenimeHtml}
                        <p class="countdown">⏳ ${countdown}</p>
                    </div>
                    <button class="btn-delete" onclick="fshijTermin(${index})">Fshij</button>
                `;
                listContainer.appendChild(div);
            });
        }

        // Eventi kur shtypim butonin "Ruaj Terminin"
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const cifti = document.getElementById('cifti').value;
            const dataOra = document.getElementById('data-ora').value;
            const lokacioni = document.getElementById('lokacioni').value;
            const pajisjet = document.getElementById('pajisjet').value;
            const cmimi = document.getElementById('cmimi').value;
            const puntoret = document.getElementById('puntoret').value;
            const pershkrimi = document.getElementById('pershkrimi').value;

            const terminIRi = { cifti, dataOra, lokacioni, pajisjet, cmimi, puntoret, pershkrimi };
            
            terminet.push(terminIRi);
            localStorage.setItem('terminetDasma', JSON.stringify(terminet));
            
            form.reset();
            shfaqTerminet();
        });

        // Funksioni për fshirjen e një termini
        window.fshijTermin = function(index) {
            if(confirm("A je i sigurt që dëshiron ta fshish këtë termin?")) {
                terminet.splice(index, 1);
                localStorage.setItem('terminetDasma', JSON.stringify(terminet));
                shfaqTerminet();
            }
        };

        // Ekzekutimi fillestar
        shfaqTerminet();
        
        // Rifreskimi i kohës çdo 1 minutë
        setInterval(shfaqTerminet, 60000);
    </script>
</body>
</html>
