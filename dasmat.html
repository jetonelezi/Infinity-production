<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemi i Termineve - Infinity Production</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; color: #333; }
        
        /* Navigimi */
        header { 
            background-color: #1a1a1a; 
            color: #d4af37; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .logo-text { font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }
        
        nav ul { list-style: none; display: flex; gap: 20px; }
        nav ul li a { 
            color: #fff; 
            text-decoration: none; 
            font-size: 0.95rem; 
            cursor: pointer; 
            transition: color 0.3s;
            padding: 5px 10px;
        }
        nav ul li a:hover, nav ul li a.active { color: #d4af37; border-bottom: 2px solid #d4af37; }
        .btn-logout { background: #ff4757; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer; }
        .btn-logout:hover { background: #ff6b81; }

        /* Kontejneri Kryesor */
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        
        /* Karta & Format */
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card h2 { margin-bottom: 20px; font-size: 1.4rem; color: #1a1a1a; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; 
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { 
            outline: none; border-color: #d4af37; box-shadow: 0 0 5px rgba(212, 175, 55, 0.3); 
        }
        
        button.btn-primary { 
            background-color: #d4af37; color: #fff; border: none; padding: 12px 20px; 
            width: 100%; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; 
        }
        button.btn-primary:hover { background-color: #b8962e; }
        
        /* Lista e Termineve */
        .termin-list { display: flex; flex-direction: column; gap: 15px; }
        .termin-item { background: #fafafa; border-left: 5px solid #d4af37; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: flex-start; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .termin-info { flex: 1; }
        .termin-info h3 { margin-bottom: 8px; font-size: 1.2rem; color: #1a1a1a; }
        .termin-info p { font-size: 0.95rem; color: #555; margin-bottom: 5px; }
        
        .price { color: #555; font-weight: 600; cursor: pointer; display: inline-block; padding: 2px 5px; border-radius: 4px; transition: background 0.2s; }
        .price:hover { background: #e0e0e0; }
        .cmimi-vlere { color: #d4af37; letter-spacing: 2px; }
        
        .notes { background: #eee; padding: 10px; border-radius: 4px; margin-top: 10px; font-size: 0.9rem; font-style: italic; }
        .countdown { color: #d84315; font-weight: 600; margin-top: 12px; font-size: 1rem; }
        
        .btn-delete { background-color: #ff4757; color: white; border: none; padding: 8px 15px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; transition: 0.3s; width: 100%;}
        .btn-delete:hover { background-color: #ff6b81; }

        .btn-edit { background-color: #3498db; color: white; border: none; padding: 8px 15px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 5px;}
        .btn-edit:hover { background-color: #2980b9; }

        .admin-actions { margin-left: 20px; display: flex; flex-direction: column; min-width: 100px;}

        /* Login Screen */
        #login-screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80') center/cover;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 10px; width: 350px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-top: 5px solid #d4af37;
        }
        .login-box h2 { margin-bottom: 20px; font-family: 'Playfair Display', serif; color: #1a1a1a; }
        .login-box input { margin-bottom: 20px; text-align: center; font-size: 1.2rem; letter-spacing: 2px; }

        /* MODAL PËR MODIFIKIM */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 100;
            display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .flex-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-cancel { background: #888; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: 600;}
        .btn-cancel:hover { background: #666; }

        /* Ndarjet e fshehura fillimisht */
        #app-screen, #view-section, #add-section { display: none; }

        footer { text-align: center; padding: 20px; margin-top: 40px; color: #888; font-size: 0.9rem; }
        footer a { color: #d4af37; text-decoration: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Infinity Production</h2>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">Shëno fjalëkalimin për të hyrë</p>
            <input type="password" id="login-password" placeholder="***" onkeypress="handleEnter(event)">
            <button class="btn-primary" onclick="kontrolloHyrjen()">Hyr</button>
            <p id="login-error" style="color: red; font-size: 0.85rem; margin-top: 10px; display: none;">Fjalëkalim i pasaktë!</p>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <div class="logo-text">Infinity Production</div>
            <nav>
                <ul>
                    <li><a id="nav-view" onclick="ndryshoFaqen('view')" class="active">Shiko Terminet</a></li>
                    <li><a id="nav-add" onclick="ndryshoFaqen('add')">Shto Termin <span style="font-size:0.7rem;">🔒</span></a></li>
                    <li><button class="btn-logout" onclick="dil()">Dil</button></li>
                </ul>
            </nav>
        </header>

        <div class="container">
            
            <div id="add-section" class="card">
                <h2>Shto Termin të Ri</h2>
                <form id="termin-form">
                    <div class="form-group">
                        <label>Çifti (ose Emri i Klientit)</label>
                        <input type="text" id="cifti" placeholder="psh. Ejup & Semavije" required>
                    </div>
                    <div class="form-group">
                        <label>Lloji i Eventit</label>
                        <select id="lloji" required>
                            <option value="" disabled selected>Zgjidh llojin...</option>
                            <option value="Dasëm">Dasëm (Komplet)</option>
                            <option value="Fejesë">Fejesë</option>
                            <option value="Kanagjegj">Kanagjegj</option>
                            <option value="Banket">Banket</option>
                            <option value="Marrja e Nuses">Marrja e Nuses</option>
                            <option value="Nata e Dhandrisë">Nata e Dhandrisë</option>
                            <option value="Tjetër">Tjetër</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Data dhe Ora</label>
                        <input type="datetime-local" id="data-ora" required>
                    </div>
                    <div class="form-group">
                        <label>Lokacioni</label>
                        <input type="text" id="lokacioni" placeholder="psh. Restorant NOBEL, Tetovë" required>
                    </div>
                    <div class="form-group">
                        <label>Pajisjet</label>
                        <input type="text" id="pajisjet" placeholder="psh. Vinç, Dron, Foto Session" required>
                    </div>
                    <div class="form-group">
                        <label>Çmimi Total (€)</label>
                        <input type="number" id="cmimi" placeholder="psh. 1500" required>
                    </div>
                    <div class="form-group">
                        <label>Stafi (Punëtorët)</label>
                        <input type="text" id="puntoret" placeholder="psh. Jeton, Agron" required>
                    </div>
                    <div class="form-group">
                        <label>Shënime Shtesë</label>
                        <textarea id="pershkrimi" rows="3" placeholder="Detaje të tjera..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Ruaj Terminin</button>
                </form>
            </div>

            <div id="view-section" class="card">
                <h2>Lista e Termineve</h2>
                <div id="termin-list" class="termin-list">
                    </div>
            </div>

        </div>

        <footer>
            <p>Krijuar nga Jeton Elezi | <a href="https://infinity-production.com">www.infinity-production.com</a></p>
        </footer>
    </div>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px; font-size: 1.4rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;">Modifiko Terminin</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-index">
                
                <div class="form-group">
                    <label>Çifti (ose Emri i Klientit)</label>
                    <input type="text" id="edit-cifti" required>
                </div>
                <div class="form-group">
                    <label>Lloji i Eventit</label>
                    <select id="edit-lloji" required>
                        <option value="Dasëm">Dasëm (Komplet)</option>
                        <option value="Fejesë">Fejesë</option>
                        <option value="Kanagjegj">Kanagjegj</option>
                        <option value="Banket">Banket</option>
                        <option value="Marrja e Nuses">Marrja e Nuses</option>
                        <option value="Nata e Dhandrisë">Nata e Dhandrisë</option>
                        <option value="Tjetër">Tjetër</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Data dhe Ora</label>
                    <input type="datetime-local" id="edit-data-ora" required>
                </div>
                <div class="form-group">
                    <label>Lokacioni</label>
                    <input type="text" id="edit-lokacioni" required>
                </div>
                <div class="form-group">
                    <label>Pajisjet</label>
                    <input type="text" id="edit-pajisjet" required>
                </div>
                <div class="form-group">
                    <label>Çmimi Total (€)</label>
                    <input type="number" id="edit-cmimi" required>
                </div>
                <div class="form-group">
                    <label>Stafi (Punëtorët)</label>
                    <input type="text" id="edit-puntoret" required>
                </div>
                <div class="form-group">
                    <label>Shënime Shtesë</label>
                    <textarea id="edit-pershkrimi" rows="2"></textarea>
                </div>
                
                <div class="flex-btns">
                    <button type="submit" class="btn-primary" style="flex: 2;">Ruaj Ndryshimet</button>
                    <button type="button" class="btn-cancel" onclick="mbyllModalin()">Anulo</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- 1. MENAXHIMI I HYRJES (LOGIN) ---
        let currentRole = null; 

        function handleEnter(e) {
            if (e.key === 'Enter') kontrolloHyrjen();
        }

        function kontrolloHyrjen() {
            const pass = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('login-error');
            
            if (pass === '123') {
                currentRole = 'viewer';
                hapAplikacionin('view');
            } else if (pass === 'jeton555!') {
                currentRole = 'admin';
                hapAplikacionin('add');
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function hapAplikacionin(faqjaFillestare) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            
            if(currentRole === 'admin') {
                document.getElementById('nav-add').innerHTML = "Shto Termin";
            }

            ndryshoFaqen(faqjaFillestare);
            shfaqTerminet();
        }

        function dil() {
            currentRole = null;
            document.getElementById('login-password').value = '';
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('nav-add').innerHTML = 'Shto Termin <span style="font-size:0.7rem;">🔒</span>';
        }

        // --- 2. MENAXHIMI I FAQEVE (ROUTING) ---
        function ndryshoFaqen(faqja) {
            if (faqja === 'add' && currentRole !== 'admin') {
                const pass = prompt("Kjo faqe është vetëm për menaxhim.\nShëno fjalëkalimin e adminit:");
                if (pass === 'jeton555!') {
                    currentRole = 'admin';
                    document.getElementById('nav-add').innerHTML = "Shto Termin"; 
                } else {
                    alert("Fjalëkalim i pasaktë!");
                    return; 
                }
            }

            document.getElementById('nav-view').classList.remove('active');
            document.getElementById('nav-add').classList.remove('active');

            document.getElementById('view-section').style.display = 'none';
            document.getElementById('add-section').style.display = 'none';

            if (faqja === 'view') {
                document.getElementById('view-section').style.display = 'block';
                document.getElementById('nav-view').classList.add('active');
                shfaqTerminet();
            } else if (faqja === 'add') {
                document.getElementById('add-section').style.display = 'block';
                document.getElementById('nav-add').classList.add('active');
            }
        }

        // --- 3. LOGJIKA E TERMINEVE ---
        let terminet = JSON.parse(localStorage.getItem('terminetDasma')) || [];

        function merrKojenEMbetur(dataTerminit) {
            const tani = new Date().getTime();
            const dataTarget = new Date(dataTerminit).getTime();
            const distanca = dataTarget - tani;

            if (distanca < 0) return "Ka përfunduar / Është sot!";

            const dite = Math.floor(distanca / (1000 * 60 * 60 * 24));
            const ore = Math.floor((distanca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            return `Kanë mbetur edhe: ${dite} ditë dhe ${ore} orë`;
        }

        window.zbuloCmimin = function(element, cmimiVertet) {
            const span = element.querySelector('.cmimi-vlere');
            if (span.innerText !== "***") return; 
            const fjalekalimi = prompt("Shënoni fjalëkalimin për të parë çmimin:");
            if (fjalekalimi === "jeton123") {
                span.innerText = cmimiVertet + " €";
                span.style.color = "#27ae60"; 
            } else if (fjalekalimi !== null) {
                alert("Fjalëkalim i pasaktë!");
            }
        };

        function shfaqTerminet() {
            const listContainer = document.getElementById('termin-list');
            listContainer.innerHTML = '';
            
            terminet.sort((a, b) => new Date(a.dataOra) - new Date(b.dataOra));

            if (terminet.length === 0) {
                listContainer.innerHTML = '<p style="color: #888; text-align: center;">Nuk ka termine të regjistruara.</p>';
                return;
            }

            terminet.forEach((termin, index) => {
                const dataEFormatizuar = new Date(termin.dataOra).toLocaleString('sq-AL', { 
                    dateStyle: 'medium', timeStyle: 'short' 
                });

                const countdown = merrKojenEMbetur(termin.dataOra);
                const shenimeHtml = termin.pershkrimi ? `<div class="notes">📝 <strong>Shënime:</strong> ${termin.pershkrimi}</div>` : '';
                const isNext = index === 0 ? '<span style="background: #d4af37; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; margin-left: 10px; vertical-align: middle;">🔥 Termini i Radhës</span>' : '';

                // Butonat Edit & Delete vetëm për Admin
                const adminActions = currentRole === 'admin' ? `
                    <div class="admin-actions">
                        <button class="btn-edit" onclick="hapModifikimin(${index})">Modifiko</button>
                        <button class="btn-delete" onclick="fshijTermin(${index})">Fshij</button>
                    </div>
                ` : '';

                const llojiEventit = termin.lloji || 'Pa specifikuar';

                const div = document.createElement('div');
                div.className = 'termin-item';
                if(index === 0) div.style.borderLeft = "8px solid #d4af37";

                div.innerHTML = `
                    <div class="termin-info">
                        <h3>${termin.cifti} ${isNext}</h3>
                        <p>🎉 <strong>Lloji:</strong> ${llojiEventit}</p>
                        <p>📅 <strong>${dataEFormatizuar}</strong></p>
                        <p>📍 ${termin.lokacioni}</p>
                        <p>🎥 ${termin.pajisjet}</p>
                        <p>👥 <strong>Stafi:</strong> ${termin.puntoret}</p>
                        <p class="price" onclick="zbuloCmimin(this, '${termin.cmimi}')" title="Kliko për të hapur çmimin">💶 Çmimi: <span class="cmimi-vlere">***</span></p>
                        ${shenimeHtml}
                        <p class="countdown">⏳ ${countdown}</p>
                    </div>
                    ${adminActions}
                `;
                listContainer.appendChild(div);
            });
        }

        // Shtimi i Terminit
        document.getElementById('termin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const cifti = document.getElementById('cifti').value;
            const lloji = document.getElementById('lloji').value;
            const dataOra = document.getElementById('data-ora').value;
            const lokacioni = document.getElementById('lokacioni').value;
            const pajisjet = document.getElementById('pajisjet').value;
            const cmimi = document.getElementById('cmimi').value;
            const puntoret = document.getElementById('puntoret').value;
            const pershkrimi = document.getElementById('pershkrimi').value;

            terminet.push({ cifti, lloji, dataOra, lokacioni, pajisjet, cmimi, puntoret, pershkrimi });
            localStorage.setItem('terminetDasma', JSON.stringify(terminet));
            
            this.reset();
            alert("Termini u ruajt me sukses!");
            ndryshoFaqen('view'); 
        });

        // Fshirja e Terminit
        window.fshijTermin = function(index) {
            if(confirm("A je i sigurt që dëshiron ta fshish këtë termin?")) {
                terminet.splice(index, 1);
                localStorage.setItem('terminetDasma', JSON.stringify(terminet));
                shfaqTerminet();
            }
        };

        // --- 4. FUNKSIONET E MODIFIKIMIT ---
        window.hapModifikimin = function(index) {
            const termin = terminet[index];
            
            // Mbushim fushat me të dhënat ekzistuese
            document.getElementById('edit-index').value = index;
            document.getElementById('edit-cifti').value = termin.cifti;
            document.getElementById('edit-lloji').value = termin.lloji || 'Dasëm';
            document.getElementById('edit-data-ora').value = termin.dataOra;
            document.getElementById('edit-lokacioni').value = termin.lokacioni;
            document.getElementById('edit-pajisjet').value = termin.pajisjet;
            document.getElementById('edit-cmimi').value = termin.cmimi;
            document.getElementById('edit-puntoret').value = termin.puntoret;
            document.getElementById('edit-pershkrimi').value = termin.pershkrimi || '';
            
            // Shfaqim modalin
            document.getElementById('edit-modal').style.display = 'flex';
        };

        window.mbyllModalin = function() {
            document.getElementById('edit-modal').style.display = 'none';
        };

        // Ruajtja e modifikimeve
        document.getElementById('edit-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const index = document.getElementById('edit-index').value;
            
            // Përditësojmë objektin në array
            terminet[index] = {
                cifti: document.getElementById('edit-cifti').value,
                lloji: document.getElementById('edit-lloji').value,
                dataOra: document.getElementById('edit-data-ora').value,
                lokacioni: document.getElementById('edit-lokacioni').value,
                pajisjet: document.getElementById('edit-pajisjet').value,
                cmimi: document.getElementById('edit-cmimi').value,
                puntoret: document.getElementById('edit-puntoret').value,
                pershkrimi: document.getElementById('edit-pershkrimi').value
            };
            
            // Ruajmë në localStorage dhe mbyllim
            localStorage.setItem('terminetDasma', JSON.stringify(terminet));
            mbyllModalin();
            shfaqTerminet(); // Rifreskojmë listën vizualisht
        });

        // Rifreskimi i kohës
        setInterval(() => {
            if (document.getElementById('view-section').style.display === 'block') {
                shfaqTerminet();
            }
        }, 60000);
    </script>
</body>
</html>
